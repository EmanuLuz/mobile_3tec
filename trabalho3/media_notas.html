<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="quadrado-roxo">
        <h2>Média do Aluno</h2>
        
        <label>Nome do Aluno</label>
        <input type="text" placeholder="Nome do Aluno" id="nome_aluno">

        <label>Nota 1º Trimestre</label>
        <input type="text" placeholder="Nota 1" id="primeira_nota">

        <label>Nota 2º Trimestre</label>
        <input type="text" placeholder="Nota 2" id="segunda_nota">

        <label>Nota 3º Trimestre</label>
        <input type="text" placeholder="Nota 3" id="terceira_nota">

        <label>Deseja Continuar? S/N</label>
        <input type="text" placeholder="S ou N" id="resposta">

        <button type="button" id="btn_calcular_media" onclick="calcularMedia()">Calcular Média</button>
        
        <div id="painel_resultado"></div>
    </div>

    <!-- <script src="js/script.js"></script> -->

     <script src="/trabalho3/js/script3.js"></script>
</body>
</html>
